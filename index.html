<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My first website, built while learning web development.">
  <title>My First Website</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="navbar">
    <a class="logo" href="#">MyWebsite</a>
    <a class="nav-link" href="#about">About me</a>
  </header>

  <main class="hero">
    <p class="eyebrow">WELCOME TO MY WEBSITE</p>
    <h1>Hello, world! 👋</h1>
    <p class="description">
      I'm learning how to build and deploy websites.
      This is my first step towards becoming a developer.
    </p>

    <button id="learnButton" type="button">Click to say hello</button>
    <p id="message" aria-live="polite"></p>
  </main>

  <section id="about" class="about">
    <h2>About this project</h2>
    <p>A simple website built with HTML, CSS and JavaScript.</p>
  </section>

  <footer>
    <p>My First Website · Built while learning</p>
  </footer>
</body>
</html>
